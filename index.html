<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b10" />
    <title>暗燼迴廊</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0b10;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #game { width: 100%; height: 100%; }
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        background: #0b0b10;
        color: #d8d4cc;
        font: 18px "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
        z-index: 10;
        text-align: center;
        padding: 24px;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-hint">請將裝置橫向以進行遊戲</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
